name: Update player ages

on:
  schedule:
    # 00:00 Israel time. GitHub cron is UTC-only, so run at both possible offsets;
    # the script skips the run that lands before midnight (data already current).
    - cron: "0 21 * * *" # IDT (UTC+3)
    - cron: "0 22 * * *" # IST (UTC+2)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-ages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh ages from ligadle.app
        run: python scripts/update_ages.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Commit and redeploy
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players.js
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update player ages ($(TZ=Asia/Jerusalem date +%F))"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
